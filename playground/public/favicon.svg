<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5a623"/>
      <stop offset="100%" stop-color="#e8860c"/>
    </linearGradient>
  </defs>
  <!-- Breakpoint steps: ascending widths representing screen sizes -->
  <rect x="4"  y="22" width="4" height="6"  rx="1" fill="url(#g)"/>
  <rect x="10" y="17" width="4" height="11" rx="1" fill="url(#g)"/>
  <rect x="16" y="11" width="4" height="17" rx="1" fill="url(#g)"/>
  <rect x="22" y="4"  width="4" height="24" rx="1" fill="url(#g)"/>
  <!-- Horizontal threshold line -->
  <line x1="2" y1="15" x2="28" y2="15" stroke="url(#g)" stroke-width="1.2" stroke-dasharray="2 2" opacity="0.5"/>
</svg>
