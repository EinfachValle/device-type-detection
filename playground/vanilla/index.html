<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Device Type Detection — Playground</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #e2e8f0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 2rem;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
        color: #38bdf8;
      }
      .info-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 1rem;
        max-width: 800px;
        width: 100%;
      }
      .card {
        background: #1e293b;
        border-radius: 12px;
        padding: 1.25rem;
        border: 1px solid #334155;
      }
      .card h2 {
        font-size: 0.875rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: #94a3b8;
        margin-bottom: 0.75rem;
      }
      .value {
        font-size: 1.5rem;
        font-weight: 700;
        color: #f1f5f9;
      }
      .value.active {
        color: #4ade80;
      }
      .value.inactive {
        color: #475569;
      }
      .flags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .flag {
        padding: 0.25rem 0.75rem;
        border-radius: 9999px;
        font-size: 0.75rem;
        font-weight: 600;
        background: #334155;
        color: #94a3b8;
      }
      .flag.active {
        background: #166534;
        color: #4ade80;
      }
      .dimensions {
        font-size: 0.875rem;
        color: #94a3b8;
        margin-top: 0.5rem;
      }
      @media (max-width: 600px) {
        .info-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <h1>Device Type Detection — Live Playground</h1>
    <div class="info-grid">
      <div class="card">
        <h2>Device Type</h2>
        <div class="value" id="deviceType">Loading...</div>
      </div>
      <div class="card">
        <h2>Orientation</h2>
        <div class="value" id="orientation">Loading...</div>
      </div>
      <div class="card">
        <h2>Viewport</h2>
        <div class="value" id="viewport">Loading...</div>
        <div class="dimensions" id="touch">Loading...</div>
      </div>
      <div class="card" style="grid-column: 1 / -1">
        <h2>Active Flags</h2>
        <div class="flags" id="flags">Loading...</div>
      </div>
    </div>

    <script type="module">
      import { createDeviceDetector } from "../../dist/index.js";

      const detector = createDeviceDetector();

      function render(state) {
        document.getElementById("deviceType").textContent = state.deviceType;
        document.getElementById("orientation").textContent = state.orientation;
        document.getElementById("viewport").textContent =
          `${state.width} × ${state.height}`;
        document.getElementById("touch").textContent = state.touchDevice
          ? "Touch Device"
          : "Non-Touch Device";

        const flagNames = [
          "isMobile",
          "isMobileS",
          "isMobileM",
          "isMobileL",
          "isTablet",
          "isTabletS",
          "isTabletM",
          "isTabletL",
          "isLaptop",
          "isDesktop",
          "isTV",
          "isTV4K",
          "isPortrait",
          "isLandscape",
          "isMobileVertical",
          "isMobileHorizontal",
          "isTabletVertical",
          "isTabletHorizontal",
        ];

        const flagsEl = document.getElementById("flags");
        flagsEl.innerHTML = flagNames
          .map(
            (name) =>
              `<span class="flag ${state[name] ? "active" : ""}">${name}: ${state[name]}</span>`,
          )
          .join("");
      }

      // Initial render
      render(detector.getState());

      // Live updates
      detector.subscribe((state) => render(state));
    </script>
  </body>
</html>
